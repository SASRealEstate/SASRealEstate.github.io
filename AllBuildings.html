<script>
function fallbackCopy(text, onSuccess){
  try{
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    if(onSuccess) onSuccess();
  }catch(e){
    alert('تعذر النسخ التلقائي، يرجى النسخ يدويًا');
  }
}

function copyTextToClipboard(text, btnEl){
  const showSuccess = () => {
    if(!btnEl) return;
    const original = btnEl.innerHTML;
    btnEl.innerHTML = '<i class="fa-solid fa-check"></i> تم النسخ';
    setTimeout(() => { btnEl.innerHTML = original; }, 1500);
  };
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(showSuccess).catch(() => fallbackCopy(text, showSuccess));
  } else {
    fallbackCopy(text, showSuccess);
  }
}

async function getListings(){
  if (!window.db) return null;
  try{
    const snap = await window.db.collection("buildings").get();
    return snap.docs.map(doc => ({docId: doc.id, ...doc.data(), id: doc.data().id || doc.id})).filter(item => item.status !== "مؤرشف");
  }catch(e){
    console.warn("تعذر تحميل العروض من قاعدة البيانات", e);
    return null;
  }
}

function renderCardHTML(item){
  const {id, type, floor, location, landArea, buildArea, facades, asking, price, photos, notes} = item;
  return `
<div class="card"
  data-id="${id}"
  data-type="${type}"
  data-price="${price}"
  data-land-area="${landArea}"
  data-build-area="${buildArea}">

  <div class="card-header">${type} – رقم ${id}</div>

  <div class="card-body">

    <div class="price-row">
      <span class="price">${price ? Number(price).toLocaleString() : "-"} ريال</span>
    </div>
    ${asking ? `<span class="rent-type-badge">السوم: ${asking}</span>` : ``}

    <div class="features">
      <div><i class="fa-solid fa-layer-group"></i> الدور: ${floor || "-"}</div>
      <div><i class="fa-solid fa-vector-square"></i> مساحة الأرض: ${landArea || "-"}</div>
      <div><i class="fa-solid fa-ruler-combined"></i> مسطح البناء: ${buildArea || "-"}</div>
      <div><i class="fa-solid fa-border-all"></i> الواجهات: ${facades || "-"}</div>
    </div>

    ${notes ? `<div class="notes">📝 ${notes}</div>` : ``}
  </div>

  <div class="card-actions">
    <a class="btn-location" href="${location}" target="_blank"><i class="fa-solid fa-location-dot"></i> الموقع</a>
    <a class="btn-photos" href="${photos}" target="_blank"><i class="fa-solid fa-images"></i> الصور</a>
    <a class="btn-whatsapp" href="https://wa.me/966534108666?text=السلام عليكم , انا مهتم%20بالعقار%20رقم%20${id}" target="_blank"><i class="fa-brands fa-whatsapp"></i> واتساب</a>
    <button type="button" class="btn-copy" onclick="
      const text = \`رقم: ${id}
نوع العقار: ${type}
الدور: ${floor}
مساحة الأرض: ${landArea}
مسطح البناء: ${buildArea}
الواجهات: ${facades}
السوم: ${asking}
السعر: ${price} ريال
ملاحظات: ${notes}
الموقع: ${location}
الصور: ${photos}\`;
      copyTextToClipboard(text, this);
    "><i class="fa-solid fa-copy"></i> نسخ</button>
  </div>
</div>
`;
}

async function buildCards(){
  const cards = document.getElementById("cards");
  cards.innerHTML = "";
  const listings = await getListings();
  if (listings === null){
    cards.innerHTML = `<div class="load-error">⚠️ حدث خطأ أثناء تحميل العروض. يرجى إعادة تحميل الصفحة أو التواصل معنا مباشرة عبر واتساب.</div>`;
    return;
  }
  listings.sort((a,b) => (parseInt(a.id)||0) - (parseInt(b.id)||0));
  cards.innerHTML = listings.map(renderCardHTML).join("");
  addAutoMapMarkers(listings);
  applyFilters();
}

const mapMarkersById = {};

function addAutoMapMarkers(listings){
  if (typeof BuildingsMap === "undefined" || !BuildingsMap) return;
  Object.values(mapMarkersById).forEach(marker => BuildingsMap.removeLayer(marker));
  Object.keys(mapMarkersById).forEach(key => delete mapMarkersById[key]);

  listings.forEach(item => {
    const lat = parseFloat(item.lat);
    const lng = parseFloat(item.lng);
    if (!isFinite(lat) || !isFinite(lng)) return;
    const popup = item.location
      ? `<a href="${item.location}" target="_blank">${item.id}</a>`
      : `${item.id}`;
    const marker = L.marker([lat, lng]).addTo(BuildingsMap).bindPopup(popup);
    mapMarkersById[String(item.id)] = marker;
  });
}

function syncMapMarkersWithFilters(){
  if (typeof BuildingsMap === "undefined" || !BuildingsMap) return;
  document.querySelectorAll(".card").forEach(card => {
    const marker = mapMarkersById[card.dataset.id];
    if (!marker) return;
    const visible = card.style.display !== "none";
    if (visible && !BuildingsMap.hasLayer(marker)) marker.addTo(BuildingsMap);
    if (!visible && BuildingsMap.hasLayer(marker)) BuildingsMap.removeLayer(marker);
  });
}

function resetFilters(){
  ["filterType","minPriceInput","maxPriceInput","minLandAreaInput","maxLandAreaInput","minBuildAreaInput","maxBuildAreaInput"].forEach(id=>{
    const el = document.getElementById(id);
    if (el) el.value = "";
  });
  applyFilters();
}

function applyFilters(){
  const type = document.getElementById("filterType")?.value || "";
  const minPrice = parseInt(document.getElementById("minPriceInput")?.value || 0);
  const maxPrice = parseInt(document.getElementById("maxPriceInput")?.value || 9999999999);
  const minLandArea = parseInt(document.getElementById("minLandAreaInput")?.value || 0);
  const maxLandArea = parseInt(document.getElementById("maxLandAreaInput")?.value || 9999999999);
  const minBuildArea = parseInt(document.getElementById("minBuildAreaInput")?.value || 0);
  const maxBuildArea = parseInt(document.getElementById("maxBuildAreaInput")?.value || 9999999999);

  document.querySelectorAll(".card").forEach(card=>{
    let show = true;
    const cardType = card.dataset.type;
    const cardPrice = parseInt((card.dataset.price || "0").replace(/[^0-9]/g,"")) || 0;
    const cardLandArea = parseInt((card.dataset.landArea || "0").replace(/[^0-9]/g,"")) || 0;
    const cardBuildArea = parseInt((card.dataset.buildArea || "0").replace(/[^0-9]/g,"")) || 0;

    if(type && cardType !== type) show = false;
    if(cardPrice < minPrice || cardPrice > maxPrice) show = false;
    if(cardLandArea < minLandArea || cardLandArea > maxLandArea) show = false;
    if(cardBuildArea < minBuildArea || cardBuildArea > maxBuildArea) show = false;

    card.style.display = show ? "" : "none";
  });

  syncMapMarkersWithFilters();
}

["filterType","minPriceInput","maxPriceInput","minLandAreaInput","maxLandAreaInput","minBuildAreaInput","maxBuildAreaInput"]
  .forEach(id => {
    document.getElementById(id)?.addEventListener("change", applyFilters);
    document.getElementById(id)?.addEventListener("input", applyFilters);
  });

document.getElementById("sortSelect")?.addEventListener("change", function(){
  const container = document.querySelector(".cards");
  const cards = Array.from(container.children);
  const value = this.value;
  if(!value) return;
  let key = "", dir = 1;
  if(value.includes("price")) key = "price";
  if(value.includes("landArea")) key = "landArea";
  if(value.endsWith("desc")) dir = -1;
  const dataKey = key === "landArea" ? "landArea" : key;
  cards.sort((a,b)=>{
    const aVal = parseInt((a.dataset[dataKey]||"0").replace(/[^0-9]/g,"")) || 0;
    const bVal = parseInt((b.dataset[dataKey]||"0").replace(/[^0-9]/g,"")) || 0;
    return (aVal - bVal) * dir;
  });
  cards.forEach(card => container.appendChild(card));
});

window.addEventListener("load", buildCards);
</script>
